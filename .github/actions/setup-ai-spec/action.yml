# .github/actions/setup-ai-spec/action.yml
name: 'Setup ai-spec'
description: 'Instala o binário ai-spec no PATH do runner (Homebrew em macOS, tarball+sha256 em Linux)'

inputs:
  version:
    description: 'Versão a instalar (vX.Y.Z ou latest)'
    required: false
    default: 'latest'

outputs:
  version-installed:
    description: 'Versão efetivamente instalada (saída de `ai-spec version`)'
    value: ${{ steps.verify.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Restore cache
      id: cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.os == 'macOS' && '/opt/homebrew/Cellar/ai-spec /opt/homebrew/Caskroom/ai-spec' || '/tmp/ai-spec-bin' }}
        key: ${{ runner.os }}-${{ runner.arch }}-ai-spec-${{ inputs.version }}

    - name: Re-link após cache restore (macOS)
      if: runner.os == 'macOS' && steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        # actions/cache restaura o Cellar mas não os symlinks em /opt/homebrew/bin/.
        # brew link recria os symlinks sem re-baixar o pacote.
        brew link ai-spec --force 2>/dev/null || brew link ai-spec

    - name: Install (macOS — Homebrew)
      if: runner.os == 'macOS' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        brew tap JailtonJunior94/homebrew-tap
        # Homebrew >= 6.x recusa formulas de taps nao confiados (erro:
        # "Refusing to load formula ... from untrusted tap"). Confiar
        # explicitamente antes do install — runner efemero, sem risco residual.
        brew trust --tap jailtonjunior94/tap
        if [ "${{ inputs.version }}" = "latest" ]; then
          brew install ai-spec
        else
          # R-1: o tap JailtonJunior94/homebrew-tap não possui formulas versionadas
          # (ex: ai-spec@v0.21.1). A tentativa de instalar versão específica via
          # "brew install ai-spec@<version>" falhará silenciosamente e fará fallback
          # para a versão latest disponível na formula. Para pinagem real de versão
          # em macOS, é necessário adicionar uma formula versionada ao tap.
          brew install "ai-spec@${{ inputs.version }}" 2>/dev/null || {
            echo "::warning::Fórmula versionada ai-spec@${{ inputs.version }} não encontrada no tap (R-1: tap sem formula versionada). Instalando versão latest disponível — versão instalada pode divergir da solicitada."
            brew install ai-spec
          }
        fi

    - name: Install (Linux — tarball + checksum)
      if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        arch="${{ runner.arch }}"
        case "$arch" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "Arquitetura não suportada: $arch" >&2; exit 1 ;;
        esac
        version="${{ inputs.version }}"
        base="https://github.com/JailtonJunior94/orchestrator/releases"
        # Quando version=latest, o nome do asset usa a versão real (ex: 0.22.0),
        # não a string "latest". Resolve via API antes de construir a URL.
        if [ "$version" = "latest" ]; then
          version=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/JailtonJunior94/orchestrator/releases/latest" \
            | grep '"tag_name"' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          if [ -z "$version" ]; then
            echo "Não foi possível resolver a versão latest via GitHub API" >&2; exit 1
          fi
        fi
        ver_no_v="${version#v}"
        tarball="ai-spec_${ver_no_v}_linux_${arch}.tar.gz"
        url="$base/download/${version}/${tarball}"
        checksum_url="$base/download/${version}/checksums.txt"
        mkdir -p /tmp/ai-spec-bin && cd /tmp/ai-spec-bin
        curl -fsSL -o "$tarball" "$url" || { echo "Falha ao baixar $url" >&2; exit 1; }
        curl -fsSL -o checksums.txt "$checksum_url" || { echo "Falha ao baixar checksums" >&2; exit 1; }
        grep "$tarball" checksums.txt | sha256sum -c - || { echo "Checksum inválido para $tarball" >&2; exit 1; }
        tar -xzf "$tarball"
        chmod +x ai-spec

    - name: Add to PATH (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: echo "/tmp/ai-spec-bin" >> "$GITHUB_PATH"

    - name: Verify install
      id: verify
      shell: bash
      run: |
        v="$(ai-spec version 2>&1 | head -n 1)"
        echo "version=$v" >> "$GITHUB_OUTPUT"
        echo "ai-spec instalado: $v"
