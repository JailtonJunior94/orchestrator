name: Test setup-ai-spec Action

on:
  pull_request:
    paths:
      - '.github/actions/setup-ai-spec/**'
      - '.github/workflows/test-setup-action.yml'

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        version: [latest, v0.21.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ai-spec
        with:
          version: ${{ matrix.version }}
      - name: Validar binário no PATH
        run: |
          which ai-spec
          ai-spec version
