name: ACP Live Tests

on:
  schedule:
    - cron: "0 6 * * *"   # nightly 06:00 UTC
  workflow_dispatch:        # gatilho manual para testes pontuais

jobs:
  acp-live:
    name: ACP Live Handshake
    runs-on: ubuntu-24.04
    continue-on-error: true  # não bloqueia merges — job opt-in

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node.js (para npx fallback)
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install claude-agent-acp via npm
        # Versao deve acompanhar ClaudeNpmVersion em internal/runtime/specs/claude.go.
        # (0.1.0 nunca foi publicada no npm — causava ETARGET; versoes reais >= 0.24.0.)
        run: npm install -g @agentclientprotocol/claude-agent-acp@0.37.0

      - name: Run ACP live tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make test-acp-live

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acp-live-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 7
