name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    name: Unit tests
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-15 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup ai-spec (smoke check RF-03)
        uses: ./.github/actions/setup-ai-spec

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test -coverprofile=coverage.out ./...

      - name: Parity gate (RP-03 / RG-03)
        # Gate obrigatório de paridade cross-CLI derivado de ADR-008: invariantes (incl. INV-30/INV-32)
        # e a suíte RP-03 (normalização idêntica nas 4 CLIs). Falha o CI se a paridade quebrar.
        run: go test -count=1 ./internal/parity/...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Cobertura total: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 75" | bc -l)" = "1" ]; then
            echo "Cobertura ${COVERAGE}% abaixo do threshold minimo de 75%"
            exit 1
          fi

      - name: Coverage por pacote critico
        continue-on-error: true
        run: bash scripts/check-package-coverage.sh 70

      - name: Verificar snapshots atualizados
        run: |
          go test ./internal/contextgen/... -run TestSnapshot 2>&1 || {
            echo "Snapshots desatualizados. Execute: UPDATE_SNAPSHOTS=1 make test"
            exit 1
          }

      - name: Fuzz (opcional)
        continue-on-error: true
        run: |
          go test -fuzz=FuzzParseFrontmatter -fuzztime=10s ./internal/skills/
          go test -fuzz=FuzzParseTaskFile -fuzztime=10s ./internal/taskloop/
          go test -fuzz=FuzzValidateBugReport -fuzztime=10s ./internal/bugschema/
          go test -fuzz=FuzzParseConfig -fuzztime=10s ./internal/config/
          go test -fuzz=FuzzParseManifest -fuzztime=10s ./internal/manifest/
          go test -fuzz=FuzzDetectLanguages -fuzztime=10s ./internal/detect/
          go test -fuzz=FuzzDetectToolchain -fuzztime=10s ./internal/detect/

  lint:
    name: Lint
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-15 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: make lint

      - name: Skills sync drift gate
        run: make check-skills-sync

      - name: Hooks sync drift gate
        run: make check-hooks-sync

      - name: Hook smoke tests
        run: make test-hooks

      - name: Setup Shellcheck (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Setup Shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Shellcheck
        run: shellcheck --severity=warning scripts/git-hooks/pre-commit scripts/*.sh

  integration:
    name: Integration tests
    needs: unit
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-15 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Integration tests
        # Inclui ./tests/integration/... (e2e claude/gemini via acpfake) — antes fora do gate,
        # o que dava CI verde enganoso (a regressão do spec_drift só aparecia aqui). Todos os
        # e2e usam fakes (acpfake), são determinísticos; testes acp_live (binário real) ficam
        # na build tag acp_live (job nightly), fora deste gate.
        run: go test -tags=integration ./internal/integration/... ./internal/skills/... ./tests/integration/...

      - name: Budget
        run: make budget
