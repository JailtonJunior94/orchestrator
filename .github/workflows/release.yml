name: release

on:
  workflow_run:
    workflows: ["Tests"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    name: Release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify tested SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}" || {
            echo "[HARD] checkout diverge do SHA aprovado pelo workflow Tests" >&2
            exit 1
          }

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      # ─── Auto-release pipeline (push to main) ────────────────────────────────

      - name: Build ai-spec binary
        run: go build -o ai-spec ./main.go

      - name: Auto-bump skill versions
        run: ./ai-spec skill-bump .

      # skill-bump muta apenas o canonico (.agents/skills); e preciso propagar
      # para os mirrors (.claude, .github, embedded) — senao o gate
      # check-skills-sync falha no proximo push normal (o commit de release usa
      # [skip ci] e nao roda o gate, deixando o drift latente).
      - name: Sync skill mirrors
        run: bash scripts/sync-skills.sh

      - name: Stage skill bumps
        run: |
          git add -A .agents/skills .agents/lib .agents/hooks \
            .claude/skills .claude/hooks .codex/hooks .gemini/hooks \
            .github/skills .github/hooks scripts/lib internal/embedded/assets

      - name: Compute next version (semver-next)
        id: semver
        run: |
          ./ai-spec semver-next . | tee /tmp/semver_output.txt
          while IFS='=' read -r key value; do
            [[ -z "$key" ]] && continue
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done < /tmp/semver_output.txt

      - name: Evaluate release conditions
        id: check
        run: |
          TARGET="${{ steps.semver.outputs.target_version }}"
          ACTION="${{ steps.semver.outputs.action }}"
          MSG="$(git log -1 --pretty=%B)"

          if [[ "$MSG" == *"[skip ci]"* ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=commit message contains [skip ci]" >> "$GITHUB_OUTPUT"
          elif [[ "$ACTION" == "no_release" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=no releasable commits (action=no_release)" >> "$GITHUB_OUTPUT"
          elif git tag -l "v${TARGET}" | grep -q .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=tag v${TARGET} already exists (idempotency guard)" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
          fi

      - name: Update VERSION file
        if: steps.check.outputs.should_release == 'true'
        run: ./ai-spec update-version --version "${{ steps.semver.outputs.target_version }}"

      - name: Generate CHANGELOG.md
        if: steps.check.outputs.should_release == 'true'
        run: ./ai-spec changelog . --version "${{ steps.semver.outputs.target_version }}"

      - name: Commit CHANGELOG.md
        if: steps.check.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          changed=false
          git diff --quiet CHANGELOG.md 2>/dev/null || changed=true
          git diff --quiet VERSION 2>/dev/null || changed=true
          if [[ "$changed" == "false" ]]; then
            echo "CHANGELOG.md and VERSION unchanged, skipping commit"
          else
            git add -A CHANGELOG.md VERSION .agents/skills .agents/lib .agents/hooks \
              .claude/skills .claude/hooks .codex/hooks .gemini/hooks \
              .github/skills .github/hooks scripts/lib internal/embedded/assets
            git commit -m "chore(release): update CHANGELOG.md and VERSION for v${{ steps.semver.outputs.target_version }} [skip ci]"
          fi

      - name: Create annotated tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          git tag -a "v${{ steps.semver.outputs.target_version }}" \
            -m "Release v${{ steps.semver.outputs.target_version }}"

      - name: Push commit and tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          git push origin HEAD:main
          git push origin "v${{ steps.semver.outputs.target_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser (auto-release)
        if: steps.check.outputs.should_release == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.semver.outputs.target_version }}

      - name: Smoke test do binario
        if: steps.check.outputs.should_release == 'true'
        continue-on-error: false
        run: |
          ./dist/ai-spec_linux_amd64_v1/ai-spec version
          ./dist/ai-spec_linux_amd64_v1/ai-spec --help
          ./dist/ai-spec_linux_amd64_v1/ai-spec inspect .

      - name: Publish workflow summary
        run: |
          {
            if [[ "${{ steps.check.outputs.should_release }}" == "true" ]]; then
              echo "## Release published"
              echo ""
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| Version   | \`v${{ steps.semver.outputs.target_version }}\` |"
              echo "| Bump      | \`${{ steps.semver.outputs.bump }}\` |"
              echo "| Action    | \`${{ steps.semver.outputs.action }}\` |"
              echo "| Range     | \`${{ steps.semver.outputs.commit_range }}\` |"
              echo "| Commits   | ${{ steps.semver.outputs.commit_count }} |"
            else
              echo "## Release skipped"
              echo ""
              echo "**Reason:** ${{ steps.check.outputs.skip_reason }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
