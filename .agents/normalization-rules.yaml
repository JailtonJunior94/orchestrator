# Tabelas de normalização de tool-calls por driver ACP.
# Carregadas em runtime via go:embed (default embedded) e override por projeto
# em .agents/normalization-rules.yaml local vence sobre embedded.
# Referência: docs/research/compozy-adaptation-claude-2026.md §"Normalização de tool-calls"
# version: 1 — schema fechado; versões desconhecidas causam erro no loader.

version: 1

# common_aliases: aliases compartilhados entre drivers que declaram inherit_common.
# Espelha commonToolTitleAliases de compozy/internal/core/agent/tool_call_name.go:84.
common_aliases:
  bash:               bash
  read_file:          read
  write_file:         write
  str_replace_editor: edit

# inherit_common: lista de drivers que herdam common_aliases sem overrides.
inherit_common:
  - opencode

aliases:
  # RF-18 — tabela propria do OpenCode. Derivada de MUTATING_TOOLS do plugin de
  # governanca (internal/embedded/assets/.opencode/plugin/governance.js), que e a
  # unica fonte verificada dos nomes que o OpenCode realmente emite.
  #
  # Precedencia: esta entrada explicita VENCE inherit_common (resolveInherit nao
  # sobrescreve driver ja presente em aliases). O opencode permanece listado em
  # inherit_common apenas como fallback declarado; sem esta tabela o driver
  # herdaria read_file/write_file/str_replace_editor, nomes que o OpenCode nunca
  # emite, e normalized_name seria sempre igual a raw_name.
  opencode:
    bash:        bash
    write:       write
    edit:        edit
    multiedit:   edit
    patch:       edit
    apply_patch: edit

  claude:
    # nome_raw : nome_normalizado
    bash:               bash
    read_file:          read
    write_file:         write
    str_replace_editor: edit

  codex:
    shell:        bash
    search_query: web_search
    image_query:  image_search

  copilot:
    run:   bash
    fetch: web_search

  cursor:
    terminal:      bash
    grep_search:   grep
    file_search:   glob
    read_file:     read
    write_file:    write

input_mappings:
  # canonicalização de campos de input por driver
  claude:
    bash:
      command: command
  codex:
    shell:
      cmd: command  # Codex usa cmd; canonizar para command
  copilot:
    # RP-01: input_mappings para Copilot.
    # Copilot expõe tool "run" (mapeada para bash via aliases.copilot).
    # O campo de input já usa "command" nativamente — no-op verificado.
    run:
      command: command  # no-op verificado: Copilot já usa "command" como chave canônica
  opencode:
    # RF-18: OpenCode ja usa "command" como chave canonica do bash — no-op
    # declarado explicitamente para que o driver tenha entrada propria, como
    # copilot.
    bash:
      command: command
  cursor:
    read_file:
      startLineNumberBaseOne: start_line
      endLineNumberBaseOne:   end_line
